<h1>My Form</h1>

<form>

    <p>Name: </p>
    <input required type="text" placeholder="enter your name" />

    <p>Phone number: </p>
    <input required type="number" placeholder="enter your number" />

    <p>Email</p>
    <input required type="email" placeholder="enter your email" />

    <p>Password</p>
    <input required type="password" placeholder="enter your password" />

    <p>Date of birth</p>
    <input required type="date" placeholder="date of birth" />

    <p>Time</p>
    <input required type="time" />

    <p>Picture</p>
    <input required type="file" />

    <p>Select favourite subject</p>
    <input type="checkbox" /> English
    <br>
    <input type="checkbox" /> Urdu
    <br>
    <input type="checkbox" /> Math


    <br>
    <p>Gender:</p>
    <input type="radio" name="gender" /> Male
    <br>
    <input type="radio" name="gender" /> Female

    <p>Favourite Color</p>
    <input required type="color" />

    <p>Range</p>
    <input required type="range" />

    <p>Address textarea</p>
    <textarea required placeholder="enter your addresss"></textarea>
    
    <br>
    <button>Form submit krain</button>
</form>
